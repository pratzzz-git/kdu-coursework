server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:smarthome-db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: "THIS_IS_A_VERY_LONG_SECRET_KEY_FOR_JWT_SHOULD_BE_AT_LEAST_32_CHARS"
  expiration: 86400000
